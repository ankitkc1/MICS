# Adjust the CUDA runtime to the driver and modules available on the target
# cluster, then archive the resolved environment with each reported study.
name: mics
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - numpy>=1.23
  - scipy>=1.10
  - pytorch>=2.0
  - pytorch-cuda=12.1
  - pip

# After creating and activating the environment, install this repository from
# its root with: python -m pip install -e . --no-deps
