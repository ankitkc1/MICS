# Schema placeholder for the future MICS implementation. Values must be pinned
# only after the manuscript objective and estimator definitions are final.
selection:
  name: mics
  implementation_status: not_implemented
  seed: 42
  independent_rng_stream: true
  budget_type: clients_per_round
  budget: 2
  modality_importance:
    estimator: paired_leave_one_modality_out_validation_dice
    partition_role: selection_probe
    primary_reduction: macro_client
    region_weights:
      WT: 0.3333333333333333
      TC: 0.3333333333333333
      ET: 0.3333333333333333
    preserve_signed_estimate: true
    selection_transform: positive_clip_then_epsilon_floor
    epsilon: 1.0e-6
    refresh_interval_rounds: null  # Preregister after measuring probe cost.
  redundancy:
    kernel: to_be_defined
  participation_history:
    enabled: true
