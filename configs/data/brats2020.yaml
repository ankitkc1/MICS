# The dataset already exists on the HPC. Set MICS_DATA_ROOT in the shell or
# Slurm script; no image files are stored in this repository.
dataset:
  name: brats2020
  root_env: MICS_DATA_ROOT
  volume_subdirectory: vol
  segmentation_subdirectory: seg
  input_layout: HWDM
  modality_order:
    - flair
    - t1ce
    - t1
    - t2
  label_mapping:
    background: 0
    necrotic_non_enhancing_core: 1
    edema: 2
    enhancing_tumor: 3
  evaluation_regions:
    whole_tumor: [1, 2, 3]
    tumor_core: [1, 3]
    enhancing_tumor: [3]

clients:
  manifest: experiments/manifests/brats2020_clients.csv
