# The dataset already exists on the HPC. Set MICS_DATA_ROOT in the shell or
# Slurm script; no image files are stored in this repository.
dataset:
  name: brats2020
  root_env: MICS_DATA_ROOT
  case_count: 368
  volume_subdirectory: vol
  segmentation_subdirectory: seg
  input_layout: HWDM
  volume_shape: [240, 240, 155, 4]
  volume_dtype: float32
  segmentation_dtype: uint8
  modality_order:
    - flair
    - t1ce
    - t1
    - t2
  label_mapping:
    background: 0
    necrotic_non_enhancing_core: 1
    edema: 2
    enhancing_tumor: 3
  evaluation_regions:
    whole_tumor: [1, 2, 3]
    tumor_core: [1, 3]
    enhancing_tumor: [3]
  preprocessing:
    intensity_normalization: existing_nonzero_voxel_zscore
    apply_additional_normalization: false
  training_patch:
    size: [96, 96, 96]
    foreground_probability: 0.5

clients:
  manifest: experiments/manifests/brats2020_clients.csv
  split_root_env: MICS_SPLIT_ROOT
  split_file_pattern: "c{client_number}.csv"
