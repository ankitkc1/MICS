# The dataset already exists on the HPC. Set MICS_DATA_ROOT in the shell or
# Slurm script; no image files are stored in this repository.
dataset:
  name: brats2020
  root_env: MICS_DATA_ROOT
  case_count: 368
  volume_subdirectory: vol
  segmentation_subdirectory: seg
  input_layout: HWDM
  volume_shape: [240, 240, 155, 4]
  volume_dtype: float32
  segmentation_dtype: uint8
  modality_order:
    - flair
    - t1ce
    - t1
    - t2
  label_mapping:
    background: 0
    necrotic_non_enhancing_core: 1
    edema: 2
    enhancing_tumor: 3
  evaluation_regions:
    whole_tumor: [1, 2, 3]
    tumor_core: [1, 3]
    enhancing_tumor: [3]
  preprocessing:
    intensity_normalization: existing_nonzero_voxel_zscore
    apply_additional_normalization: false
  training_patch:
    size: [96, 96, 96]
    foreground_probability: 0.5

clients:
  # A materialized scenario is authoritative for both case partitions and
  # modality masks. SplitA and SplitB deliberately share case assignments but
  # reverse FLAIR/T1ce availability to isolate modality heterogeneity.
  scenario_bundle_root_env: MICS_SPLIT_BUNDLE_ROOT
  scenario_config_filename: materialized_config.json
  scenarios:
    A:
      directory: splitA
      expected_modality_pool_sizes: {flair: 7, t1ce: 2, t1: 5, t2: 4}
    B:
      directory: splitB
      expected_modality_pool_sizes: {flair: 2, t1ce: 7, t1: 5, t2: 4}
  global_test_filename: global_test.csv

legacy_integration_smoke_tests:
  split_root_env: MICS_SPLIT_ROOT
  split_file_pattern: "c{client_number}.csv"
