evaluation:
  inference:
    method: sliding_window
    roi_size: [96, 96, 96]
    overlap: 0.5
    blending: gaussian
    gaussian_sigma_scale: 0.125
    mixed_precision: true
  geometry:
    spacing_mm: [1.0, 1.0, 1.0]
  regions:
    WT: [1, 2, 3]
    TC: [1, 3]
    ET: [3]
  empty_region_policy:
    both_empty_dice: 1.0
    both_empty_hd95_mm: 0.0
    one_empty_dice: 0.0
    one_empty_hd95_mm: 373.13
  reporting:
    subject_level_first: true
    include_region_dice: true
    include_region_hd95: true
    include_mean_dice: true
    include_macro_client: true
    include_sample_weighted: true
