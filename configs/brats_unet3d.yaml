# Reference experiment settings. The model itself does not require a YAML parser.
model:
  modalities:
    t1: 1
    t1ce: 1
    t2: 1
    flair: 1
  num_classes: 4
  base_channels: 16
  num_levels: 4
  fusion: mean_var
  norm: group
  dropout: 0.0
  modality_dropout: 0.2

training:
  patch_size: [96, 96, 96]
  loss: dice_cross_entropy
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.00001

federated_components:
  modality_specific:
    - encoder:t1
    - encoder:t1ce
    - encoder:t2
    - encoder:flair
  shared:
    - fusion
    - decoder
    - head
