# General architecture configuration. Dataset-specific modality names may be
# overridden by an experiment configuration.
model:
  name: multi_encoder_unet3d
  modalities:
    t1: 1
    t1ce: 1
    t2: 1
    flair: 1
  num_classes: 4
  base_channels: 16
  num_levels: 4
  fusion: mean_var
  norm: group
  dropout: 0.0
  modality_dropout: 0.2

federated_components:
  modality_specific:
    - encoder:t1
    - encoder:t1ce
    - encoder:t2
    - encoder:flair
  shared:
    - fusion
    - decoder
    - head
